<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Avaliação Inteligente - ToxoPrev</title>
  <link rel="stylesheet" href="entre.css">
  <link rel="icon" type="image/png" href="favicon2 (2).png">

</head>

<body>

<div class="top-buttons">

  <a href="tratamento.html" class="tratamento-btn">
    Ver Tratamentos
  </a>

  <a href="index.html" class="voltar-btn">
    ← Voltar
  </a>

</div>

<section class="entrevista-page">

  <div class="entrevista-box">

    <div class="entrevista-top">

      <span class="entrevista-tag">
        Entrevista Inteligente
      </span>

      <h2>
        Avaliação de Toxoplasmose
      </h2>

      <p class="descricao">
        Responda as perguntas abaixo para realizar
        uma análise de risco relacionada à toxoplasmose.
      </p>

    </div>

    <!-- PROGRESSO -->

    <div class="progress-area">

      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>

      <span id="porcentagem">
        0% concluído
      </span>

    </div>

    <!-- ÁREA -->

    <div id="entrevistaArea">

      <div class="question-card">

        <span class="question-number" id="numeroPergunta">
          Pergunta 1
        </span>

        <h3 id="pergunta">
          Carregando pergunta...
        </h3>

        <div id="inputArea"></div>

        <div class="opcoes" id="opcoes"></div>

      </div>

    </div>

  </div>

</section>

<script>

const perguntas = [

  {
    pergunta:"Você possui contato frequente com gatos?",
    tipo:"opcoes",
    opcoes:["Sim","Não","Talvez"]
  },

  {
    pergunta:"Você limpa caixa de areia de gatos?",
    tipo:"opcoes",
    opcoes:["Frequentemente","Raramente","Nunca"]
  },

  {
    pergunta:"Você costuma consumir carne mal passada?",
    tipo:"opcoes",
    opcoes:["Frequentemente","Raramente","Nunca"]
  },

  {
    pergunta:"Você lava frutas e verduras antes de comer?",
    tipo:"opcoes",
    opcoes:["Sim","Não"]
  },

  {
    pergunta:"Você bebe água filtrada?",
    tipo:"opcoes",
    opcoes:["Sempre","Às vezes","Nunca"]
  },

  {
    pergunta:"Você teve febre recentemente?",
    tipo:"opcoes",
    opcoes:["Sim","Não","Talvez"]
  },

  {
    pergunta:"Você sente dores musculares frequentemente?",
    tipo:"opcoes",
    opcoes:["Sim","Não"]
  },

  {
    pergunta:"Você apresenta cansaço excessivo?",
    tipo:"opcoes",
    opcoes:["Frequentemente","Raramente"]
  },

  {
    pergunta:"Você possui sistema imunológico baixo?",
    tipo:"opcoes",
    opcoes:["Sim","Não","Não sei"]
  },

  {
    pergunta:"Você já realizou exame para toxoplasmose?",
    tipo:"opcoes",
    opcoes:["Sim","Não"]
  },

  {
    pergunta:"Quantas vezes por semana você consome carne vermelha?",
    tipo:"numero"
  },

  {
    pergunta:"Você costuma andar descalço em terra ou areia?",
    tipo:"opcoes",
    opcoes:["Frequentemente","Raramente","Nunca"]
  }

];

let perguntaAtual = 0;
let respostas = [];

const perguntaEl = document.getElementById("pergunta");
const opcoesEl = document.getElementById("opcoes");
const inputArea = document.getElementById("inputArea");
const numeroPergEl = document.getElementById("numeroPergunta");
const progressEl = document.getElementById("progress");
const porcentagemEl = document.getElementById("porcentagem");
const entrevistaArea = document.getElementById("entrevistaArea");

function carregarPergunta(){

  const atual = perguntas[perguntaAtual];

  perguntaEl.innerHTML = atual.pergunta;

  numeroPergEl.innerHTML =
    `Pergunta ${perguntaAtual + 1}`;

  opcoesEl.innerHTML = "";
  inputArea.innerHTML = "";

  atualizarProgresso();

  if(atual.tipo === "opcoes"){

    atual.opcoes.forEach(opcao => {

      const btn = document.createElement("button");

      btn.classList.add("option-btn");

      btn.innerHTML = opcao;

      btn.onclick = () => salvarResposta(opcao);

      opcoesEl.appendChild(btn);

    });

  }

  if(atual.tipo === "numero"){

    inputArea.innerHTML = `
      <input
        type="number"
        id="respostaNumero"
        placeholder="Digite um número"
      >
    `;

    opcoesEl.innerHTML = `
      <button
        class="primary-btn"
        onclick="enviarNumero()"
      >
        Continuar
      </button>
    `;

  }

}

function salvarResposta(resposta){

  respostas.push(resposta);

  perguntaAtual++;

  if(perguntaAtual < perguntas.length){

    carregarPergunta();

  } else {

    mostrarResultado();

  }

}

function enviarNumero(){

  const valor =
    document.getElementById("respostaNumero").value;

  if(valor === ""){

    alert("Digite um número!");

    return;

  }

  salvarResposta(Number(valor));

}

function atualizarProgresso(){

  const porcento =
    (perguntaAtual / perguntas.length) * 100;

  progressEl.style.width = `${porcento}%`;

  porcentagemEl.innerHTML =
    `${Math.round(porcento)}% concluído`;

}

function mostrarResultado(){

  progressEl.style.width = "100%";

  porcentagemEl.innerHTML = "100% concluído";

  let pontuacao = 0;

  respostas.forEach(r => {

    if(typeof r === "string"){

      if(
        r === "Sim" ||
        r === "Frequentemente" ||
        r === "Sempre"
      ){
        pontuacao += 10;
      }

      else if(
        r === "Talvez" ||
        r === "Às vezes" ||
        r === "Raramente"
      ){
        pontuacao += 5;
      }

    }

    else{

      pontuacao += Math.min(r,10);

    }

  });

  const maxPontos =
    perguntas.length * 10;

  const taxa =
    Math.round((pontuacao / maxPontos) * 100);

  let nivel = "";
  let emoji = "";
  let mensagem = "";

  if(taxa <= 30){

    nivel = "BAIXA";
    emoji = "✅";

    mensagem =
      "As respostas indicam baixa possibilidade de toxoplasmose.";

  }

  else if(taxa <= 60){

    nivel = "MÉDIA";
    emoji = "⚠️";

    mensagem =
      "As respostas indicam média possibilidade de toxoplasmose.";

  }

  else{

    nivel = "ALTA";
    emoji = "🚨";

    mensagem =
      "As respostas indicam alta possibilidade de toxoplasmose.";

  }

  entrevistaArea.innerHTML = `

    <div class="resultado-final">

      <h2>
        ${emoji} Possibilidade ${nivel}
      </h2>

      <p>
        ${mensagem}
      </p>

      <p>
        <strong>Pontuação:</strong>
        ${taxa}%
      </p>

      <div class="alerta-tratamento">
        👉 Recomendamos que você se direcione para a área de
        <strong>Tratamento</strong> para receber orientações,
        cuidados e informações importantes.
      </div>

      <div class="resultado-acoes">

        <a
          href="tratamento.html"
          class="btn-tratamento"
        >
          Ver Tratamentos
        </a>

        <button
          class="btn-refazer"
          onclick="reiniciarEntrevista()"
        >
          Refazer Avaliação
        </button>

      </div>

    </div>

  `;

}

function reiniciarEntrevista(){

  location.reload();

}

carregarPergunta();

</script>

</body>
</html>
